name: Build Anime3rb

run-name: "Anime3rb build | ${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.conf.json"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.6. Leave empty to build without releasing."
        required: false
      notes:
        description: "Release notes"
        required: false

permissions:
  contents: read

concurrency:
  group: anime3rb-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Bump version and tag
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version and tag
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3" >&2
            exit 1
          fi
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1$version\2/" package.json src-tauri/tauri.conf.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$version\"/" src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $version"
          git tag "v$version"
          git push origin HEAD:main
          git push origin "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: prepare
    if: "!cancelled() && needs.prepare.result != 'failure'"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        id: app-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Derive updater public key from signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo run --quiet --manifest-path scripts/updater-key-inspector/Cargo.toml

      - name: Test updater signature verifier
        run: node scripts/test-updater-signatures.mjs

      - name: Verify updater signing key matches embedded public key
        env:
          VERSION: ${{ steps.app-version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/verify-updater-keypair.mjs

      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify generated updater signatures
        env:
          VERSION: ${{ steps.app-version.outputs.version }}
        run: node scripts/verify-updater-signatures.mjs src-tauri/target/release/bundle

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Anime3rb-v${{ steps.app-version.outputs.version }}-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APKs
    needs: prepare
    if: "!cancelled() && needs.prepare.result != 'failure'"
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Use stable debug keystore
        if: env.ANDROID_DEBUG_KEYSTORE != ''
        run: |
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read app version
        id: app-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Use installed NDK
        run: echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Initialize Android project with system bar handling
        run: npm run android:init
      - run: npm run tauri android build -- --apk --debug --split-per-abi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: Anime3rb-v${{ steps.app-version.outputs.version }}-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [prepare, windows, android]
    if: "!cancelled() && needs.prepare.result != 'failure' && needs.windows.result == 'success' && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: Anime3rb-v${{ steps.v.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify Windows updater signatures
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/verify-updater-signatures.mjs dist

      - name: Build updater manifest
        env:
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: node scripts/latest-json.mjs

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          body: ${{ inputs.notes }}
          files: dist/**
          fail_on_unmatched_files: true
