name: Release command

# Comment "/release 0.1.7" (or "/release patch") on an issue to publish.
# The comment's following lines become the release notes.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: release-command
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/release') &&
      (github.event.comment.user.login == vars.RELEASE_BOT ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const issue_number = context.issue.number;
            const body = context.payload.comment.body.trim();
            const say = (text) => github.rest.issues.createComment({ ...repo, issue_number, body: text });

            const match = body.match(/^\/release(?:\s+(\S+))?/i);
            if (!match) return;

            // Version: explicit semver, or patch/minor/major from the latest release.
            const requested = (match[1] || 'patch').toLowerCase();
            let version = requested;
            if (!/^\d+\.\d+\.\d+$/.test(requested)) {
              if (!['patch', 'minor', 'major'].includes(requested)) {
                await say('Use `/release 0.1.7`, or `/release patch`, `/release minor`, `/release major`.');
                return;
              }
              const latest = await github.rest.repos.getLatestRelease(repo).catch(() => null);
              const base = (latest?.data?.tag_name || 'v0.0.0').replace(/^v/, '');
              const [major, minor, patch] = base.split('.').map(Number);
              version = requested === 'major' ? `${major + 1}.0.0`
                : requested === 'minor' ? `${major}.${minor + 1}.0`
                : `${major}.${minor}.${patch + 1}`;
            }

            const tag = `v${version}`;
            const exists = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })
              .then(() => true).catch(() => false);
            if (exists) {
              await say(`Tag \`${tag}\` already exists. Pick a higher version.`);
              return;
            }

            // build.yml cancels concurrent runs on main, so never overlap a release.
            for (const status of ['in_progress', 'queued']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'build.yml', status, per_page: 1
              });
              if (data.total_count > 0) {
                await say(`A build is already ${status}. Wait for it to finish, then comment again.`);
                return;
              }
            }

            const notes = body.split('\n').slice(1).join('\n').trim() || `Release ${version}`;
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'build.yml', ref: 'main', inputs: { version, notes }
            });
            await say(`Release \`${version}\` dispatched: https://github.com/${repo.owner}/${repo.repo}/actions/workflows/build.yml`);
